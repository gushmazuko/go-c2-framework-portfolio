title: AMSI Tampering Indicators in PowerShell Command Line
id: 513c2ae7-9f96-408b-8697-99ed4b0f2d2a
status: experimental
description: >
  Command-line markers of AMSI tampering (T1562.001) — the class strings
  public atomics touch (System.Management.Automation.AmsiUtils,
  amsiInitFailed). Honest scope note: an in-memory patch of
  AmsiScanBuffer is NOT visible on the command line or to classic Sysmon;
  this rule catches the script-string variants and the EDR-side hunt is
  described in detections/playbooks/T1562.001-amsi-patching.md. Scenario:
  SC-06, executed through the framework shell.
references:
  - https://github.com/gushmazuko/go-c2-framework-portfolio
author: gushmazuko
date: 2026-09-02
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - \powershell.exe
      - \pwsh.exe
    CommandLine|contains:
      - AmsiUtils
      - amsiInitFailed
      - AmsiScanBuffer
  condition: selection
falsepositives:
  - Security tooling and AMSI test scripts legitimately reference these strings.
level: high
