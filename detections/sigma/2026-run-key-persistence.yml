title: Run Key Persistence Write
id: c3b6008a-78fa-4001-a7cc-9d4ffaf613a4
status: experimental
description: >
  A value written under the per-user or per-machine Run key — the
  persistence procedure of scenario SC-03 (T1547.001), executed via `reg
  add` through the framework shell. Lab-level rule: broad by design so
  the scenario reliably fires.
references:
  - https://github.com/gushmazuko/go-c2-framework-portfolio
author: gushmazuko
date: 2026-09-02
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: \SOFTWARE\Microsoft\Windows\CurrentVersion\Run
  condition: selection
falsepositives:
  - Legitimate software installation (very common). On the range, correlate with the C2 shell parent.
level: medium
