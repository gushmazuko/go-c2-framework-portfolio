title: C2 Beacon Periodicity (Multiple Short Connections)
id: 2be95732-d673-48b2-a7b7-4adb531eb4e6
status: experimental
correlation:
  type: temporal
  rules:
    - 3a366c73-e4c3-4323-9855-eb0fcef7a690   # 2026-c2-agent-outbound-listener-connection
  group-by:
    - Image
  timespan: 10m
  count: 8
description: >
  Repeated short network exchanges from the same process within a short
  window — the shape of the framework's HTTPS beacon transport
  (T1071.001/T1029, default sleep 30s ± 20% jitter). The mTLS transport
  does NOT fire this (one long-lived connection, use the base rule).
  Scope note: Sigma cannot express interval regularity directly; this
  correlation flags the poll cadence (>= 8 connections in 10 minutes =
  default 30s sleep with no jitter headroom). Score the *regularity* of
  the intervals (stdev across deltas) in the SIEM — a jittered beacon
  still shows a stable mean; see
  detections/playbooks/T1071-c2-transport-beaconing.md.
references:
  - https://github.com/gushmazuko/go-c2-framework-portfolio
author: gushmazuko
date: 2026-09-02
tags:
  - attack.command-and-control
  - attack.t1071.001
  - attack.t1029
logsource:
  category: network_connection
  product: windows
falsepositives:
  - Any polling application (mail clients, update agents) — group-by Image keeps the alert per-process.
level: high
