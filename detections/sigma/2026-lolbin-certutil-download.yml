title: Certutil Download or Decode (LOLBin)
id: 0caa33c9-b9da-43ae-ab46-068318375644
status: experimental
description: >
  certutil used for URL retrieval or base64 decode/encode — the LOLBin
  procedure of scenario SC-04 (T1105 ingress via certutil urlcache,
  T1027-adjacent encode/decode flag use), run through the framework
  shell.
references:
  - https://github.com/gushmazuko/go-c2-framework-portfolio
author: gushmazuko
date: 2026-09-02
tags:
  - attack.command-and-control
  - attack.t1105
  - attack.defense-evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \certutil.exe
    CommandLine|contains:
      - urlcache
      - verifyctl
      - -decode
      - -encode
  condition: selection
falsepositives:
  - Admins diagnosing certificate stores (rarely with urlcache/decode); correlate with the C2 shell parent.
level: high
