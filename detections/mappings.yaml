    detections:
      - "playbooks/T1134-token-manipulation.md"
    exercised: live

  - capability: uac-bypass
    scenario: scenarios/SC-11-uac-bypass.md
    attack: [T1548.002]
    detections:
      - sigma/2026-uac-bypass-fodhelper.yml
      - "playbooks/T1548.002-uac-bypass.md"
    exercised: live

  - capability: anti-debug-validation
    scenario: scenarios/SC-12-antidebug-validation.md
    attack: [T1622]
    detections:
      - sigma/2026-c2-debugger-attached-to-agent.yml
      - "playbooks/T1622-anti-debug.md"
    exercised: live

documented_not_exercised:
  # Architectural evasion families: no open procedure reproduces their
  # artifacts, so this range cannot exercise them without implementing the
  # technique in the implant — which it declines (finalization-plan §6).
  # Each ships a detection playbook describing what defenders should hunt
  # for in EDR/memory telemetry regardless.

  - family: sleep-obfuscation
    playbook: playbooks/architectural-evasion-families.md#sleep-obfuscation
    attack: []                 # no stable ATT&CK ID; T1027-adjacent (memory encryption vs scanners)
    note: memory-scan signatures of sleep-time encryption, thread-context anomalies
  - family: direct-indirect-syscalls
    playbook: playbooks/architectural-evasion-families.md#direct-indirect-syscalls
    attack: [T1106]            # adjacent: Native API abuse without hooked-API traces
    note: syscall-from-unbacked-memory heuristics, missing hooked-API frames in call stacks
  - family: implant-integrated-injection
    playbook: playbooks/architectural-evasion-families.md#implant-integrated-injection
    attack: [T1055]            # T1055 family, but the integrated (not procedural) variant
    note: call-stack/parent-child anomalies; loader-less allocation patterns
