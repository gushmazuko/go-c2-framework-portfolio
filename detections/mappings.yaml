# ATT&CK mapping for the go-c2-framework range.
#
# Three tiers:
#   framework_native         — implant capabilities, exercised live by the agent itself
#   scenario_backed          — procedures run through the framework shell (scenarios/ runbooks)
#   documented_not_exercised — architectural evasion families; detection playbooks only,
#                              no open procedure reproduces their artifacts (finalization-plan §6)
#
# Ground truth for every mapping is the server's SQLite audit log
# (tasks.attack_tag / transfers.attack_tag), so an engagement replay lists
# exactly which techniques were exercised and what the SIEM should have seen.
meta:
  project: go-c2-framework
  mapping_version: 1
  updated: "2026-09-02"
  attack_version: v15
  ground_truth: "SQLite audit: data/c2server.db (tasks, transfers, sessions)"
  scope_note: >
    Server = linux/amd64 (operator side), agent = windows/amd64 (range
    host). Detections here target the Windows endpoint unless noted.

framework_native:

  - capability: agent-execution
    description: rat-agent.exe started on the target (ssh, manual, or delivery)
    attack: [T1059]            # the start itself is operator-driven; see also T1204 if user-launched
    host_artifacts:
      - "ProcessCreate: C:\\labs\\rat-agent.exe (console/debug builds write a banner; release builds are GUI-subsystem and silent)"
      - "ImageLoad: rat-agent.exe loading crypt32/BCrypt TLS stack modules at startup"
    network_artifacts:
      - "Outbound TLS 1.3 to the listener; Go crypto stack TLS fingerprint"
    detections:
      - sigma/2026-c2-agent-binary-execution.yml
      - sigma/2026-c2-agent-outbound-listener-connection.yml
    exercised: live

  - capability: session-mtls-persistent
    description: one long-lived mutually-authenticated TLS connection; task loop over it
    attack: [T1095]            # Non-Application Layer Protocol (custom binary framing inside TLS)
    host_artifacts:
      - "NetworkConnect: long-lived TCP session, no user-context browser lineage"
    network_artifacts:
      - "TLS 1.3-only, client-cert handshake; frames are length-prefixed JSON + binary chunks"
    detections:
      - sigma/2026-c2-agent-outbound-listener-connection.yml
    exercised: live

  - capability: session-https-beacon
    description: periodic HTTPS poll (sleep ± jitter), tasks/results batched per cycle
    attack: [T1071.001, T1029] # Web Protocols; Scheduled Transfer
    host_artifacts:
      - "NetworkConnect: short POST /beacon exchanges at a regular cadence"
    network_artifacts:
      - "Beacon periodicity (interval ± jitter percent); Connection: close per response"
    detections:
      - sigma/2026-c2-agent-outbound-listener-connection.yml
      - sigma/2026-c2-beacon-periodicity.yml
    exercised: live

  - capability: exec
    description: server-issued command execution (cmd / powershell / sh per agent report)
    attack: [T1059, T1059.003, T1059.001]
    host_artifacts:
      - "ProcessCreate: cmd.exe or powershell.exe with rat-agent.exe as parent"
      - "audit log: tasks row attack_tag=T1059"
    network_artifacts:
      - "command_output chunks riding the session transport"
    detections:
      - sigma/2026-c2-agent-spawns-shell.yml
    exercised: live

  - capability: shell-conpty
    description: interactive ConPTY shell (cmd/powershell), resize + reattach
    attack: [T1059.003]        # Windows Command Shell
    host_artifacts:
      - "ProcessCreate: conhost.exe spawned headless by rat-agent.exe (pseudoconsole)"
      - "cmd.exe / powershell.exe under rat-agent.exe"
    network_artifacts:
      - "interactive keystroke-sized uplink bursts instead of task batches"
    detections:
      - sigma/2026-c2-agent-spawns-shell.yml
      - sigma/2026-c2-conpty-headless-conhost.yml
    exercised: live

  - capability: download
    description: server pulls a file from the agent (chunked, resumable)
    attack: [T1005, T1105]     # collecting data from the endpoint (audit tags T1005);
                               # the C2 transport leg is T1105
    host_artifacts:
      - "FileOpen/read of the source file; chunk spool under data/transfers/<id>/ on the SERVER"
      - "audit log: transfers row direction=download attack_tag=T1005"
    network_artifacts:
      - "binary chunk frames; sustained uplink volume from the agent"
    detections:
      - sigma/2026-c2-transfer-spool-file-activity.yml
    exercised: live

  - capability: upload
    description: server pushes a file to the agent (temp spool + atomic rename)
    attack: [T1105]            # Ingress Tool Transfer (audit tags T1105)
    host_artifacts:
      - "FileCreate: .rat-upload-<random> next to the target path, then rename to the final name"
      - "persistent transport only — uploads over the https beacon are rejected by design"
    network_artifacts:
      - "sustained downlink volume to the agent on a live connection"
    detections:
      - sigma/2026-c2-transfer-spool-file-activity.yml
    exercised: live

  - capability: anti-debug
    description: agent checks for user-mode debuggers at startup and every 30s; self-exits on a positive
    attack: [T1622]            # Debugger Evasion (owner scope decision 2026-09-02)
    host_artifacts:
      - "API calls: IsDebuggerPresent, CheckRemoteDebuggerPresent, NtQueryInformationProcess(ProcessDebugPort/ProcessDebugFlags)"
      - "visible only to EDR/ETW-TI class telemetry — classic Sysmon does not log these reads"
      - "symptom: agent process exits with code 0 while a debugger is attached"
    network_artifacts:
      - "none by design (silent exit, no indicator sent)"
    detections:
      - sigma/2026-c2-debugger-attached-to-agent.yml
      - "playbooks/T1622-anti-debug.md"
    exercised: live            # validated via debug-probe, scenario SC-12

  - capability: task-queue
    description: tasks issued to a disconnected (beacon) session queue server-side with TTL
    attack: []                 # operator-side mechanics; no host artifact on the endpoint
    host_artifacts: []
    network_artifacts: []
    detections: []
    exercised: live

  - capability: audit-trail
    description: SQLite persistence of sessions/tasks/transfers with ATT&CK tags
    attack: []                 # ground truth source, not an endpoint behavior
    host_artifacts: []
    network_artifacts: []
    detections: []
    exercised: live

